<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyVault — Spaced Revision Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="index.css" />
<link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="grain"></div>

  <!-- HEADER -->
  <header>
    <div class="logo">Study<span>Vault</span></div>
    <div class="header-meta">
      <span id="today-date"></span>
      <div class="status-dot" id="conn-dot" title="DB Status"></div>
    </div>
    <nav>
      <div class="nav-inner">
        <a href="../journals/index.html" class="active">Journals</a>
        <a href="../projects/index.html">Projects</a>
        <a href="../media/index.html">Media</a>
      </div>
    </nav>
  </header>

  <!-- REVISIONS DUE BANNER -->
  <section class="revisions-banner" id="revisions-banner">
    <div class="banner-header">
      <h2>📅 Revisions Due Today</h2>
      <span class="badge" id="revision-count">0</span>
    </div>
    <div class="revision-list" id="revision-list">
      <p class="empty-state">No revisions due today. Keep studying! 🎯</p>
    </div>
  </section>

  <main>
    <!-- LEFT: LOG + CALENDAR -->
    <div class="left-col">

      <!-- LOG STUDY -->
      <section class="card log-card">
        <h3 class="card-title">Log Today's Study</h3>
        <div class="form-group">
          <label>Topic / Subject</label>
          <input type="text" id="topic-input" placeholder="e.g. React Hooks, Calculus Ch.3…" />
        </div>
        <div class="form-group">
          <label>Notes <span class="optional">(optional)</span></label>
          <textarea id="notes-input" rows="3" placeholder="What did you cover? Key formulas, concepts…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group half">
            <label>Duration (min)</label>
            <input type="number" id="duration-input" placeholder="60" min="1" />
          </div>
          <div class="form-group half">
            <label>Date</label>
            <input type="date" id="date-input" />
          </div>
        </div>
        <div class="revision-intervals">
          <label>Revision Schedule</label>
          <div class="interval-chips">
            <span class="chip active" data-day="7">7d</span>
            <span class="chip active" data-day="30">30d</span>
            <span class="chip active" data-day="45">45d</span>
            <span class="chip active" data-day="60">60d</span>
            <span class="chip active" data-day="90">90d</span>
            <span class="chip active" data-day="180">180d</span>
          </div>
        </div>
        <button class="btn-primary" id="log-btn">
          <span class="btn-text">Log Study Session</span>
          <span class="btn-loader hidden">⏳</span>
        </button>
        <div class="feedback" id="log-feedback"></div>
      </section>

      <!-- CALENDAR -->
      <section class="card calendar-card">
        <div class="cal-header">
          <button class="cal-nav" id="cal-prev">&#8592;</button>
          <h3 id="cal-month-label">Month Year</h3>
          <button class="cal-nav" id="cal-next">&#8594;</button>
        </div>
        <div class="cal-weekdays">
          <span>Su</span><span>Mo</span><span>Tu</span><span>We</span>
          <span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legend">
          <span class="legend-dot l1"></span><span>1 session</span>
          <span class="legend-dot l2"></span><span>2–3</span>
          <span class="legend-dot l3"></span><span>4+</span>
        </div>
      </section>

    </div>

    <!-- RIGHT: STUDY NOTES -->
    <div class="right-col">
      <section class="card notes-card">
        <div class="notes-header">
          <h3 class="card-title">All Study Notes</h3>
          <div class="search-wrap">
            <input type="text" id="search-input" placeholder="Search topics…" />
          </div>
        </div>
        <div class="notes-list" id="notes-list">
          <p class="empty-state">Loading your notes…</p>
        </div>
      </section>
    </div>
  </main>

  <!-- RESCHEDULE MODAL -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h3>Reschedule Revision</h3>
      <p id="modal-topic-name">Topic</p>
      <label>New Date</label>
      <input type="date" id="modal-date" />
      <div class="modal-actions">
        <button class="btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn-primary" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
